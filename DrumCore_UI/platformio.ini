; PlatformIO build configuration for DrumCore_UI (Wemos D1 Mini / ESP8266).
; This is the Wemos display+encoder controller that talks to the ESP32 DrumCore
; over a high-speed UART at 921600 baud.
[platformio]
src_dir = .

[env:drumcore_ui]
platform = espressif8266
board = d1_mini
framework = arduino
; 160MHz cuts interrupt preemption latency so the encoder ISR does not miss
; the brief quadrature corners that WiFi/timer interrupts would swallow at 80MHz.
board_build.f_cpu = 160000000L
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    mathertel/RotaryEncoder@^1.6.0
