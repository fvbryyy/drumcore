; Build configuration only (not firmware source).
; ESP32-S3 with PSRAM (DrumCore target).
[platformio]
src_dir = .

[env:drumcore]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.psram = opi
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
